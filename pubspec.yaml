name: junglengine
description: "junglEngine: a tracker style resequencer for breakbeats, plus a tiny monophonic sub synth."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  audio_session: ^0.2.4
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  flutter_soloud: ^4.1.7
  path_provider: ^2.1.6
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/breaks/
    - assets/kits/hawkstreak/
    - assets/kits/hawkstreak02/
