name: junglengine
description: "junglEngine: a tracker style resequencer for breakbeats, plus a tiny monophonic sub synth."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  archive: ^4.2.0
  audio_session: ^0.2.4
  cupertino_icons: ^1.0.8
  ffi: ^2.1.4
  file_picker: ^12.0.0
  firebase_analytics: ^12.4.6
  firebase_core: ^4.13.0
  firebase_crashlytics: ^5.2.7
  flutter_riverpod: ^3.4.2
  flutter_soloud: ^4.1.7
  in_app_purchase: ^3.3.0
  intl: any
  path_provider: ^2.1.6
  share_plus: ^13.3.0

  # In repo, not published: the platform audio decoder behind Pro import.
  junglengine_decode:
    path: packages/junglengine_decode

  # In repo, not published: the Rust audio engine, behind JE_LIRA_ENGINE.
  junglengine_engine:
    path: packages/junglengine_engine

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/breaks/
    - assets/kits/hawkstreak/
    - assets/kits/hawkstreak02/
    - assets/kits/hawkstreak03/
