name: junglengine_engine
description: "junglEngine's audio engine: the mixer, the device and the C ABI between them."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.4

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    # No Dart-facing platform class and no method channel: the only thing the
    # platform sides do is compile the Rust crate and get it linked. Everything
    # else goes over dart:ffi.
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      macos:
        ffiPlugin: true
